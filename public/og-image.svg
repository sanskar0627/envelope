<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Santorini Travel Envelope</title>
  <desc id="desc">A cream travel envelope with brown twine, postal marks, and an oxblood wax seal on a warm bookcloth desk.</desc>
  <defs>
    <radialGradient id="desk" cx="45%" cy="38%" r="78%">
      <stop offset="0" stop-color="#5b4030"/>
      <stop offset="1" stop-color="#211711"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ddc1"/>
      <stop offset="1" stop-color="#d4b18d"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e4cb"/>
      <stop offset="1" stop-color="#dfc09e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="wax" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#220b07" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#desk)"/>
  <ellipse cx="620" cy="420" rx="450" ry="120" fill="#170d08" opacity=".58" filter="url(#shadow)"/>
  <g transform="rotate(-3 600 320)">
    <rect x="170" y="175" width="860" height="300" rx="4" fill="#9b6f4e" opacity=".72" transform="translate(8 12)"/>
    <rect x="170" y="165" width="860" height="300" rx="4" fill="url(#paper)" stroke="#a87b58" stroke-width="3"/>
    <path d="M174 169 600 360 1026 169Z" fill="url(#flap)" stroke="#b18867" stroke-width="3"/>
    <path d="M175 461 475 340M1025 461 725 340" fill="none" stroke="#bd916b" stroke-width="3" opacity=".7"/>
    <g fill="#4b382d" font-family="Georgia, serif">
      <text x="220" y="365" font-size="44" font-weight="700" letter-spacing="3">SANTORINI</text>
      <text x="222" y="406" font-size="24" letter-spacing="8">GREECE</text>
    </g>
    <g fill="none" stroke="#55443a" opacity=".72">
      <circle cx="830" cy="235" r="56" stroke-width="4"/>
      <circle cx="932" cy="235" r="58" stroke="#b94f3d" stroke-width="4"/>
      <rect x="820" y="318" width="150" height="110" stroke-width="3"/>
      <path d="M830 394h130M830 378h130M830 362h130" stroke-width="2"/>
    </g>
    <g stroke="#85502f" stroke-width="9" stroke-linecap="round">
      <path d="M585 160C576 255 578 370 588 470"/>
      <path d="M612 160C622 255 620 370 610 470"/>
    </g>
    <g filter="url(#wax)">
      <path d="M535 310c0-48 34-78 70-78s70 30 70 78-34 78-70 78-70-30-70-78Z" fill="#8a1510" stroke="#c34535" stroke-width="7"/>
      <circle cx="605" cy="310" r="47" fill="none" stroke="#4b0806" stroke-width="6"/>
      <path d="M605 277v66M570 310h70M584 336l21-18 21 18" fill="none" stroke="#e1806b" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
  <text x="600" y="555" fill="#ead8bf" font-family="Georgia, serif" font-size="25" font-style="italic" letter-spacing="5" text-anchor="middle">A DIGITAL PAPER ARTIFACT FROM SANTORINI</text>
</svg>
